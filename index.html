<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Forge</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#10131a;
  color:white;
  transition:.3s;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  text-align:center;
  padding:20px 10px;
}

h1{
  margin:0;
  font-size:38px;
}

.subtitle{
  opacity:.7;
  margin-top:8px;
}

.card{
  background:#191e29;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 8px 25px #0005;
}

.quote{
  font-size:20px;
  line-height:1.5;
  text-align:center;
  font-weight:bold;
}

.countdown{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

button,input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  font-size:15px;
}

button{
  background:#4f7cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.result{
  font-size:22px;
  font-weight:bold;
  text-align:center;
  margin-top:12px;
}

.topic{
  background:#242b39;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}

.small{
  opacity:.7;
  font-size:13px;
}

.danger{
  background:#d64545;
}

.success{
  background:#25a36f;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>⚡ STUDY FORGE</h1>
  <div class="subtitle">Forge your future. One chapter at a time.</div>
</header>

<!-- MOTIVATION -->
<div class="card">
  <div class="quote" id="quote">Loading motivation...</div>
</div>

<!-- COUNTDOWN -->
<div class="card">
  <h2>📅 Exam Countdown</h2>

  <input type="date" id="examDate">

  <div class="countdown" id="countdown">
    Set your exam date
  </div>

  <button onclick="saveExamDate()">💾 Save Exam Date</button>
</div>

<!-- CHAPTER CALCULATOR -->
<div class="card">
  <h2>🧮 Study Calculator</h2>

  <label>Chapters remaining</label>
  <input type="number" id="chapters" placeholder="Example: 20">

  <label>Days remaining</label>
  <input type="number" id="days" placeholder="Example: 10">

  <button onclick="calculateChapters()">
    Calculate Daily Target
  </button>

  <div class="result" id="calcResult"></div>
</div>

<!-- QUESTION CALCULATOR -->
<div class="card">
  <h2>📝 Question Calculator</h2>

  <label>Questions remaining</label>
  <input type="number" id="questions" placeholder="Example: 100">

  <label>Days remaining</label>
  <input type="number" id="questionDays" placeholder="Example: 10">

  <button onclick="calculateQuestions()">
    Calculate Daily Questions
  </button>

  <div class="result" id="questionResult"></div>
</div>

<!-- SYLLABUS -->
<div class="card">
  <h2>📚 My Syllabus</h2>

  <input id="subject" placeholder="Subject name">

  <textarea id="topics"
  placeholder="Enter topics, one per line&#10;Example:&#10;Real Numbers&#10;Polynomials&#10;Linear Equations"></textarea>

  <button onclick="saveSyllabus()">💾 Save Syllabus</button>

  <div id="syllabusList"></div>
</div>

<!-- THEME -->
<div class="card">
  <h2>🎨 Customize Study Forge</h2>

  <label>Choose background</label>

  <select id="theme" onchange="changeTheme()">
    <option value="dark">Dark</option>
    <option value="blue">Blue</option>
    <option value="purple">Purple</option>
    <option value="green">Green</option>
    <option value="light">Light</option>
  </select>
</div>

<!-- RESET -->
<div class="card">
  <h2>⚙️ App Settings</h2>

  <button class="danger" onclick="resetApp()">
    Reset Study Forge
  </button>

  <p class="small">
    This clears saved exam date, syllabus and theme from this device.
  </p>
</div>

</div>

<script>

/* =========================
   MOTIVATIONAL QUOTES
========================= */

const quotes = [
  "Discipline beats motivation.",
  "Your future self is watching what you do today.",
  "One chapter today is one less chapter tomorrow.",
  "Small progress every day becomes massive progress.",
  "Don't wait for motivation. Start.",
  "Study now. Relax later.",
  "You don't need to be perfect. You need to be consistent.",
  "Every question you solve makes you stronger.",
  "Your exam is temporary. Your knowledge stays.",
  "Focus on the next chapter, not the whole mountain.",
  "Hard work today creates confidence tomorrow.",
  "Make your comeback so strong that nobody can ignore it.",
  "No excuses. Just progress.",
  "Open the book. Start the mission.",
  "Eden Protocol: ACTIVE. 🔥"
];

function showRandomQuote(){

  const randomIndex =
    Math.floor(Math.random() * quotes.length);

  document.getElementById("quote").textContent =
    "“" + quotes[randomIndex] + "”";
}


/* =========================
   EXAM COUNTDOWN
========================= */

function saveExamDate(){

  const date =
    document.getElementById("examDate").value;

  if(!date){
    alert("Please select your exam date.");
    return;
  }

  localStorage.setItem("studyForgeExamDate",date);

  updateCountdown();

  alert("Exam date saved! 🔥");
}


function updateCountdown(){

  const savedDate =
    localStorage.getItem("studyForgeExamDate");

  if(!savedDate){
    document.getElementById("countdown").textContent =
      "Set your exam date";
    return;
  }

  document.getElementById("examDate").value =
    savedDate;

  const exam =
    new Date(savedDate + "T00:00:00");

  const today =
    new Date();

  today.setHours(0,0,0,0);

  const difference =
    exam - today;

  const days =
    Math.ceil(difference / (1000*60*60*24));

  if(days > 0){

    document.getElementById("countdown").textContent =
      days + " DAYS LEFT 🔥";

  }else if(days === 0){

    document.getElementById("countdown").textContent =
      "EXAM IS TODAY! 🚀";

  }else{

    document.getElementById("countdown").textContent =
      "Exam date has passed.";

  }
}


/* =========================
   CHAPTER CALCULATOR
========================= */

function calculateChapters(){

  const chapters =
    Number(document.getElementById("chapters").value);

  const days =
    Number(document.getElementById("days").value);

  if(chapters <= 0 || days <= 0){

    document.getElementById("calcResult").textContent =
      "Enter valid numbers.";

    return;
  }

  const daily =
    Math.ceil(chapters / days);

  document.getElementById("calcResult").textContent =
    "🎯 Study " + daily + " chapter(s) per day";
}


/* =========================
   QUESTION CALCULATOR
========================= */

function calculateQuestions(){

  const questions =
    Number(document.getElementById("questions").value);

  const days =
    Number(document.getElementById("questionDays").value);

  if(questions <= 0 || days <= 0){

    document.getElementById("questionResult").textContent =
      "Enter valid numbers.";

    return;
  }

  const daily =
    Math.ceil(questions / days);

  document.getElementById("questionResult").textContent =
    "📝 Solve " + daily + " question(s) per day";
}


/* =========================
   SYLLABUS
========================= */

function saveSyllabus(){

  const subject =
    document.getElementById("subject").value.trim();

  const topicsText =
    document.getElementById("topics").value.trim();

  if(!subject || !topicsText){

    alert("Enter subject and topics.");

    return;
  }

  let syllabus =
    JSON.parse(
      localStorage.getItem("studyForgeSyllabus") || "[]"
    );

  const topics =
    topicsText
      .split("\n")
      .map(x => x.trim())
      .filter(x => x !== "");

  syllabus.push({
    subject:subject,
    topics:topics
  });

  localStorage.setItem(
    "studyForgeSyllabus",
    JSON.stringify(syllabus)
  );

  document.getElementById("subject").value="";
  document.getElementById("topics").value="";

  displaySyllabus();
}


function displaySyllabus(){

  const list =
    document.getElementById("syllabusList");

  const syllabus =
    JSON.parse(
      localStorage.getItem("studyForgeSyllabus") || "[]"
    );

  list.innerHTML="";

  syllabus.forEach((item,index)=>{

    const box =
      document.createElement("div");

    box.className="topic";

    box.innerHTML =
      "<strong>📖 " +
      item.subject +
      "</strong><br>" +
      item.topics
        .map(t => "• " + t)
        .join("<br>") +
      "<br><br>" +
      "<button onclick='deleteSubject(" +
      index +
      ")' class='danger'>Delete</button>";

    list.appendChild(box);

  });
}


function deleteSubject(index){

  let syllabus =
    JSON.parse(
      localStorage.getItem("studyForgeSyllabus") || "[]"
    );

  syllabus.splice(index,1);

  localStorage.setItem(
    "studyForgeSyllabus",
    JSON.stringify(syllabus)
  );

  displaySyllabus();
}


/* =========================
   THEMES
========================= */

function changeTheme(){

  const theme =
    document.getElementById("theme").value;

  localStorage.setItem(
    "studyForgeTheme",
    theme
  );

  applyTheme(theme);
}


function applyTheme(theme){

  const body =
    document.body;

  if(theme === "dark"){
    body.style.background="#10131a";
    body.style.color="white";
  }

  if(theme === "blue"){
    body.style.background="#071a33";
    body.style.color="white";
  }

  if(theme === "purple"){
    body.style.background="#1b0b2e";
    body.style.color="white";
  }

  if(theme === "green"){
    body.style.background="#071f18";
    body.style.color="white";
  }

  if(theme === "light"){
    body.style.background="#eeeeee";
    body.style.color="#111111";
  }
}


/* =========================
   RESET
========================= */

function resetApp(){

  const confirmReset =
    confirm(
      "Are you sure you want to reset Study Forge?"
    );

  if(!confirmReset) return;

  localStorage.removeItem("studyForgeExamDate");
  localStorage.removeItem("studyForgeSyllabus");
  localStorage.removeItem("studyForgeTheme");

  location.reload();
}


/* =========================
   START APP
========================= */

showRandomQuote();

displaySyllabus();

updateCountdown();

const savedTheme =
  localStorage.getItem("studyForgeTheme") || "dark";

document.getElementById("theme").value =
  savedTheme;

applyTheme(savedTheme);

setInterval(updateCountdown,60000);

</script>

</body>
</html>
